server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses for the JS/CSS bundle.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API lives on the backend container; same origin means no CORS setup.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating a PDF or a screenshot can take a while.
        proxy_read_timeout 120s;
        # Downloads (index.html, CSV, PDF) must stream, not buffer to disk.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Hashed assets never change, so let the browser keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: a deep link such as /billing or /leads/<id> is not a file
    # on disk, so it must fall back to index.html. Without this, refreshing any
    # page other than "/" returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
