services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: umkm_scraper
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      STORAGE_DIR: /data/storage
      # Override these in a real deployment.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before starting}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-http://localhost:8080}
      DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE:-}
      DUITKU_API_KEY: ${DUITKU_API_KEY:-}
      DUITKU_PRODUCTION: ${DUITKU_PRODUCTION:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - storage_data:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  # Serves the built SPA and proxies /api to the backend, so the whole app is
  # reachable on one port with no CORS configuration.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  storage_data:
